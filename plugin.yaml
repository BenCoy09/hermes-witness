name: hermes-witness
version: 1.0.0
description: Evidence-gated learning. Grades every skill the agent writes against the receipts in its own tool trail (unresolved failures, unrun verification, dropped user constraints), tracks real-world outcomes, and quarantines skills that were never earned.
author: Hermes Witness contributors
license: MIT
provides_hooks:
  - post_tool_call
  - pre_llm_call
  - on_session_end
